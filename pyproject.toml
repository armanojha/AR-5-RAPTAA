[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-audit"
version = "0.6.0"
description = "Satellite activity audit layer for public infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AR-5-RAPTAA" }]
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "reportlab>=4.0",
]

[project.scripts]
drishti = "drishti.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

